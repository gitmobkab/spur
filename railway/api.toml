# Config-as-code for the `api` service. In Railway: service Settings -> Config-as-code -> /railway/api.toml
[build]
builder = "RAILPACK"
buildCommand = "go build -ldflags='-s -w' -o out ./cmd/api"
watchPatterns = ["cmd/api/**", "internal/**", "go.mod", "go.sum", "railway/api.toml"]

[deploy]
startCommand = "./out"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
