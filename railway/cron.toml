# Config-as-code for the `cron` service. In Railway: service Settings -> Config-as-code -> /railway/cron.toml
[build]
builder = "RAILPACK"
buildCommand = "go build -ldflags='-s -w' -o out ./cmd/cron"
watchPatterns = ["cmd/cron/**", "internal/**", "go.mod", "go.sum", "railway/cron.toml"]

[deploy]
startCommand = "./out"
cronSchedule = "15 3 * * *" # daily 03:15 UTC
restartPolicyType = "NEVER"
